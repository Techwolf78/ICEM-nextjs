name: Deploy ICEM Next.js to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Static Site
        run: npm run build

      - name: 🚀 Deploy to cPanel (Ultra Fast rsync with fallback)
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          HOST: ${{ secrets.CPANEL_HOST }}
          USER: ${{ secrets.CPANEL_USER }}
          PORT: ${{ secrets.CPANEL_PORT || '22' }}
          TARGET: ${{ secrets.REMOTE_TARGET || format('/home/{0}/public_html', secrets.CPANEL_USER) }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Attempt delta sync with rsync (only transfers new PDFs, modified files & code in seconds)
          if rsync -avz --no-perms --no-owner --no-group -e "ssh -p $PORT -o StrictHostKeyChecking=no" out/ "$USER@$HOST:$TARGET/"; then
            echo "✅ Deployment completed successfully via rsync!"
          else
            echo "⚠️ rsync unavailable, falling back to smart archive packaging..."
            node scripts/prepare-deploy-package.js
            scp -P "$PORT" -o StrictHostKeyChecking=no deploy.tar.gz "$USER@$HOST:$TARGET/"
            ssh -p "$PORT" -o StrictHostKeyChecking=no "$USER@$HOST" "tar -xzf $TARGET/deploy.tar.gz -C $TARGET/ && rm -f $TARGET/deploy.tar.gz"
            echo "✅ Deployment completed successfully via archive fallback!"
          fi
